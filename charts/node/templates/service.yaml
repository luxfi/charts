apiVersion: v1
kind: Service
metadata:
  name: {{ include "node.fullname" . }}
  labels: {{- include "node.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "node.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
---
# Headless: every validator gets stable DNS so peers find each other by name
# rather than by an address that moves.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "node.fullname" . }}-peer
  labels: {{- include "node.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "node.selector" . | nindent 4 }}
  ports:
    - name: staking
      port: {{ .Values.ports.staking }}
      targetPort: staking
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
